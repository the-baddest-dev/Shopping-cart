<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="col-9 col-lg-6 col-md-5 mx-auto mt-4 shadow p-4">
      <h2 class="text-center text-decoration-underline py-3">
        Mini Shopping Cart
      </h2>
      <input
        type="text"
        class="form-control form-control-sm shadow-none ps-3 py-2"
        placeholder="Enter your item here"
        id="input"
      />
      <button class="w-100 btn btn-success mt-3" onclick="addItem()">
        Add item
      </button>
      <button class="w-100 btn btn-warning mt-3" onclick="deleteOne()">
        Delete last item
      </button>
      <button class=" w-100 btn btn-danger mt-3" onclick="deleteAll()">
        Delete all
      </button>
      <div
        class="text-center mt-4 bg-dark text-white py-3 border rounded-2"
        id="displayArea"
      >
        Your result will show here
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
